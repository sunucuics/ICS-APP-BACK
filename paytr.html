<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">
  <title>PayTR 3 Taksit Testi</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      background: #f0f2f5;
    }

    .container {
      max-width: 450px;
      margin: 0 auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    h2 {
      text-align: center;
      color: #1a1a1a;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 14px;
      color: #444;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 16px;
    }

    input:focus {
      border-color: #007bff;
      outline: none;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #0056b3;
    }

    .summary {
      background: #e9f5ff;
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 14px;
      color: #004085;
    }
  </style>
</head>

<body>

  <div class="container">
    <h2>💳 3 Taksitli Ödeme (World)</h2>

    <div class="summary">
      <strong>Sipariş No (OID):</strong> 222222265656565<br>
      <strong>Ödenecek Tutar:</strong> 11.50 TL<br>
      <strong>Taksit:</strong> 3 x 3.83 TL<br>
      <small>Token: ...67FXZPe7RUo=</small>
    </div>

    <!-- PayTR Direct API Formu -->
    <form action="https://www.paytr.com/odeme" method="POST">

      <input type="hidden" name="merchant_id" value="628320">
      <input type="hidden" name="user_ip" value="1.1.1.1">
      <input type="hidden" name="merchant_oid" value="222222265656565">
      <input type="hidden" name="email" value="efehanh0@gmail.com">
      <input type="hidden" name="payment_type" value="card">
      <input type="hidden" name="payment_amount" value="11.50">
      <input type="hidden" name="currency" value="TL">
      <input type="hidden" name="test_mode" value="0">
      <input type="hidden" name="non_3d" value="0">
      <input type="hidden" name="client_lang" value="tr">
      <input type="hidden" name="merchant_ok_url" value="https://api.innovacraftstudio.com/paytr/success">
      <input type="hidden" name="merchant_fail_url" value="https://api.innovacraftstudio.com/paytr/fail">
      <input type="hidden" name="user_name" value="Efehan Türk">
      <input type="hidden" name="user_address" value="Test Adresi No:1 Istanbul">
      <input type="hidden" name="user_phone" value="05551234567">

      <!-- Sepet İçeriği: Ürün + Vade Farkı -->
      <input type="hidden" name="user_basket"
        value="W1sieWVuaSDDvHLDvG4gMjIiLCIxMC4wMCIsMV0sWyIzIFRha3NpdCBWYWRlIEZhcmvEsSAoJTE1LjAwKSIsIjEuNTAiLDFdXQ==">

      <input type="hidden" name="installment_count" value="3">
      <input type="hidden" name="debug_on" value="1">
      <input type="hidden" name="card_type" value="maximum">
      <input type="hidden" name="paytr_token" value="hnf2DoYhu86trDRirhEbRefAHGzllsaM67FXZPe7RUo=">

      <!-- KART BİLGİLERİ -->
      <label>Kart Üzerindeki İsim</label>
      <input type="text" name="cc_owner" placeholder="Ad Soyad" required>

      <label>Kart Numarası (World özellikli)</label>
      <input type="text" name="card_number" placeholder="xxxx xxxx xxxx xxxx" maxlength="19" required>

      <div style="display: flex; gap: 10px;">
        <div style="flex: 1;">
          <label>Ay</label>
          <select name="expiry_month" required>
            <option value="">Ay</option>
            <option value="01">01</option>
            <option value="02">02</option>
            <option value="03">03</option>
            <option value="04">04</option>
            <option value="05">05</option>
            <option value="06">06</option>
            <option value="07">07</option>
            <option value="08">08</option>
            <option value="09">09</option>
            <option value="10">10</option>
            <option value="11">11</option>
            <option value="12">12</option>
          </select>
        </div>
        <div style="flex: 1;">
          <label>Yıl</label>
          <select name="expiry_year" required>
            <option value="">Yıl</option>
            <option value="2026">2026</option>
            <option value="2027">2027</option>
            <option value="2028">2028</option>
            <option value="2029">2029</option>
            <option value="2030">2030</option>
            <option value="2031">2031</option>
            <option value="2032">2032</option>
            <option value="2033">2033</option>
            <option value="2034">2034</option>
          </select>
        </div>
      </div>

      <label>CVV Güvenlik Kodu</label>
      <input type="text" name="cvv" placeholder="123" maxlength="4" required>

      <button type="submit">11.50 TL Öde (3 Taksit)</button>
    </form>
  </div>

</body>

</html>
