<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PayTR Ödeme</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; padding: 24px; }
    .wrap { max-width: 520px; margin: 0 auto; border: 1px solid #e5e7eb; border-radius: 12px; padding: 16px; }
    label { display:block; margin-top: 10px; font-size: 14px; }
    input, select { width: 100%; padding: 10px; margin-top: 6px; border: 1px solid #d1d5db; border-radius: 10px; }
    button { width: 100%; margin-top: 16px; padding: 12px; border: 0; border-radius: 10px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="wrap">
    <h2>Ödeme Bilgileri</h2>

    <form id="paytr_form" method="post" action="https://www.paytr.com/odeme" accept-charset="UTF-8">
      <!-- Kart Sahibi -->
      <label>Kart Üzerindeki İsim</label>
      <input name="cc_owner" autocomplete="cc-name" required />

      <!-- Kart No -->
      <label>Kart Numarası</label>
      <input
        name="card_number"
        inputmode="numeric"
        autocomplete="cc-number"
        placeholder="XXXX XXXX XXXX XXXX"
        required
      />

      <!-- SKT -->
      <label>Son Kullanma Tarihi</label>
      <div style="display:flex; gap:10px;">
        <select name="expiry_month" required>
          <option value="">Ay</option>
          <option value="01">01</option><option value="02">02</option><option value="03">03</option>
          <option value="04">04</option><option value="05">05</option><option value="06">06</option>
          <option value="07">07</option><option value="08">08</option><option value="09">09</option>
          <option value="10">10</option><option value="11">11</option><option value="12">12</option>
        </select>

        <select name="expiry_year" required>
          <option value="">Yıl</option>
          <option value="2026">2026</option>
          <option value="2027">2027</option>
          <option value="2028">2028</option>
          <option value="2029">2029</option>
          <option value="2030">2030</option>
          <option value="2031">2031</option>
          <option value="2032">2032</option>
          <option value="2033">2033</option>
          <option value="2034">2034</option>
          <option value="2035">2035</option>
        </select>
      </div>

      <!-- CVV -->
      <label>CVV</label>
      <input
        name="cvv"
        inputmode="numeric"
        autocomplete="cc-csc"
        placeholder="XXX"
        required
      />

      <!-- Backend'den gelen fields (SENİN JSON) -->
      <input type="hidden" name="merchant_id" value="628320" />
      <input type="hidden" name="user_ip" value="31.155.23.172" />
      <input type="hidden" name="merchant_oid" value="34653564523645622666" />
      <input type="hidden" name="email" value="efehanh0@gmail.com" />
      <input type="hidden" name="payment_type" value="card" />
      <input type="hidden" name="payment_amount" value="10.00" />
      <input type="hidden" name="currency" value="TL" />
      <input type="hidden" name="test_mode" value="0" />
      <input type="hidden" name="non_3d" value="0" />
      <input type="hidden" name="client_lang" value="tr" />
      <input type="hidden" name="merchant_ok_url" value="https://api.innovacraftstudio.com/paytr/success" />
      <input type="hidden" name="merchant_fail_url" value="https://api.innovacraftstudio.com/paytr/fail" />
      <input type="hidden" name="user_name" value="Efe Hüs" />
      <input type="hidden" name="user_address" value="Barbaros Mah., Örnek Sk. No:1 D:3, Beşiktaş, İstanbul" />
      <input type="hidden" name="user_phone" value="905456110745" />
      <input type="hidden" name="user_basket" value="W1siVGVzdCDDnHLDvG4iLCIxMC4wMCIsMV1d" />
      <input type="hidden" name="installment_count" value="0" />
      <input type="hidden" name="debug_on" value="1" />
      <input type="hidden" name="paytr_token" value="SIwX9/jmx4yDamvQ+kcx6X5Q8mKMlI5UXp9+yr/pqh8=" />

      <button type="submit">Ödemeyi Başlat</button>
    </form>
  </div>
</body>
</html>
